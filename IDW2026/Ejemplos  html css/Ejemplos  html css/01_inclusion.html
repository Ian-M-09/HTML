<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Inclusión de CSS</title>
    <!-- Inclusion Externa -->
    <link rel="stylesheet" href="css/01_inclusion.css">
    
    <!-- Inclusión Interna -->
    <style>
        .metodo-interno {
            color: #1e3a8a;
            background-color: #dbeafe;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Métodos de Inclusión de CSS</h1>
    <div class="metodo-externo">
        <p>Este bloque está modificado está mediante <strong>CSS Externo</strong> </p>
    </div>
    <div class="metodo-interno">
        <p>Este bloque está modificado estilizado mediante <strong>CSS Interno</strong> </p>
    </div>
</body>
</html>
