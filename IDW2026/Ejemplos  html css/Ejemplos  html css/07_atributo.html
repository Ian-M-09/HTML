<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>7. Selectores por Atributo</title>
    <link rel="stylesheet" href="css/07_atributo.css">
</head>
<body>
    <h2>Formulario con Estilos por Atributo</h2>
    <form>
        <label>Usuario (Input Text):</label><br>
        <input type="text" placeholder="Escribe tu usuario"><br><br>
        
        <label>Contraseña (Input Password):</label><br>
        <input type="password" placeholder="Escribe tu clave"><br><br>
        
        <input type="submit" value="Iniciar Sesión">
    </form>
</body>
</html>
