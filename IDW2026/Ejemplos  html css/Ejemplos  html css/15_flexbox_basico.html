<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>17. Fundamentos Flexbox</title>
    <link rel="stylesheet" href="css/15_flexbox_basico.css">
</head>
<body>
    <h2>Flexbox: display: flex y flex-direction</h2>
    
    <h3>1. flex-direction: row (Por defecto)</h3>
    <div class="contenedor flex-row">
        <div class="caja">Caja 1</div>
        <div class="caja">Caja 2</div>
        <div class="caja">Caja 3</div>
    </div>

    <h3>2. flex-direction: column</h3>
    <div class="contenedor flex-column">
        <div class="caja">Caja 1</div>
        <div class="caja">Caja 2</div>
        <div class="caja">Caja 3</div>
    </div>
</body>
</html>
